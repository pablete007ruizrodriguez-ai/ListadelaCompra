<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de la Compra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Lista de la Compra</h1>

    <div class="input-card">
      <div class="row-top">
        <input type="text" id="productInput" placeholder="Nombre del producto...">
        <button id="addBtn">+</button>
      </div>
      <div class="row-bottom">
        <select id="supermarketSelect">
          <option value="" disabled selected>▾ Supermercado</option>
          <option value="Mercadona">Mercadona</option>
          <option value="Eroski">Eroski</option>
          <option value="BM">BM</option>
        </select>

        <select id="locationSelect">
          <option value="" disabled selected>▾ Ubicación</option>
          <option value="Ranera">Ranera</option>
          <option value="Barakaldo">Barakaldo</option>
        </select>
      </div>
    </div>

    <ul id="shoppingList"></ul>

    <button id="clearAllBtn" class="clear-all">Borrar todo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
