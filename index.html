<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de la Compra</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-card">
    <header class="app-header">
      <div class="badge"><span class="pulse"></span> Sincronizado en Vivo</div>
      <h1>Lista de la Compra 🛒</h1>
    </header>

    <div class="input-card">
      <div class="input-group">
        <input type="text" id="productInput" placeholder="¿Qué necesitas comprar?" class="styled-input">
      </div>
      
      <div class="row-selects">
        <select id="supermarketSelect" class="styled-select">
          <option value="" disabled selected>Supermercado *</option>
          <option value="Mercadona">Mercadona</option>
          <option value="Eroski">Eroski</option>
          <option value="BM">BM</option>
        </select>

        <select id="locationSelect" class="styled-select">
          <option value="" disabled selected>Ubicación *</option>
          <option value="Ranera">Ranera</option>
          <option value="Barakaldo">Barakaldo</option>
        </select>
      </div>

      <button id="addBtn" class="primary-btn">Añadir a la lista</button>
      <p id="errorMessage" class="error-msg"></p>
    </div>

    <!-- Lista de productos -->
    <ul id="shoppingList" class="product-list"></ul>

    <!-- Botón abajo del todo -->
    <button id="clearAllBtn" class="clear-btn">🗑️ Borrar todo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
